name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ashiato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ashiato
          MYSQL_DATABASE: ashiato
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pashiato" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ashiato#2026"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ashiato#2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ashiato
          APP_USER: ashiato
          APP_USER_PASSWORD: ashiato
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
    env:
      ASHIATO_TEST_POSTGRES_URL: postgres://postgres:ashiato@127.0.0.1:5432/postgres
      ASHIATO_TEST_MYSQL_URL: mysql://root:ashiato@127.0.0.1:3306/ashiato
      ASHIATO_TEST_MSSQL_URL: mssql://sa:Ashiato%232026@127.0.0.1:1433/master
      ASHIATO_TEST_ORACLE_URL: oracle://ashiato:ashiato@127.0.0.1:1521/FREEPDB1
      # creates the SELECT-only user the Oracle test connects as
      ASHIATO_TEST_ORACLE_ADMIN_URL: oracle://system:ashiato@127.0.0.1:1521/FREEPDB1
      ASHIATO_REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter ashiato exec playwright-core install --with-deps chromium
      # the browser test injects the built client script
      - run: pnpm build
      - run: pnpm test
